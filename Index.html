<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Day Timeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column with five bottom tabs. Each tab is a screen; Timeline and Food share a day strip. */
:root {
  --bg: #E8EDE8;
  --surface: #F6F8F4;
  --ink: #14201A;
  --muted: #55655B;
  --line: #C6D1C7;
  --accent: #17785A;
  --accent-ink: #FFFFFF;
  --danger: #B3261E;
  --c-sleep: #5B5FC7;
  --c-food: #C28410;
  --c-study: #17785A;
  --c-health: #2878B4;
  --c-mind: #C2467A;
  --c-task: #6D7B73;
  --c-routine: #738078;
  --c-move: #CC5F22;
  --c-screen: #8A5FC2;
  --c-event: #B83A3A;
  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1411; --surface: #17201B; --ink: #E6EEE8; --muted: #93A399; --line: #2A372F;
    --accent: #4CC79B; --accent-ink: #07281D; --danger: #FF8A80;
    --c-sleep: #8C90F0; --c-food: #E5B04A; --c-study: #4CC79B; --c-health: #5BB2EA; --c-mind: #EC7DAB;
    --c-task: #96A39B; --c-routine: #96A39B; --c-move: #F0935E; --c-screen: #B79CF0; --c-event: #F08080;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #17201B; --ink: #E6EEE8; --muted: #93A399; --line: #2A372F;
  --accent: #4CC79B; --accent-ink: #07281D; --danger: #FF8A80;
  --c-sleep: #8C90F0; --c-food: #E5B04A; --c-study: #4CC79B; --c-health: #5BB2EA; --c-mind: #EC7DAB;
  --c-task: #96A39B; --c-routine: #96A39B; --c-move: #F0935E; --c-screen: #B79CF0; --c-event: #F08080;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; padding-inline: 16px; padding-block: 16px 130px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.screen { display: flex; flex-direction: column; gap: 18px; }

.cat-sleep { --cat: var(--c-sleep); } .cat-food { --cat: var(--c-food); } .cat-study { --cat: var(--c-study); }
.cat-health { --cat: var(--c-health); } .cat-mind { --cat: var(--c-mind); } .cat-task { --cat: var(--c-task); }
.cat-routine { --cat: var(--c-routine); } .cat-move { --cat: var(--c-move); } .cat-screen { --cat: var(--c-screen); } .cat-event { --cat: var(--c-event); }

.top { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.label { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.example { font: 500 11px var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 10px; }
h1 { font: 800 30px/1.05 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { margin: 0; font: 800 18px var(--f-display); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.day { flex: 0 0 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); position: relative; }
.day .dow { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.day .num { font: 600 18px var(--f-display); font-variant-numeric: tabular-nums; }
.day .has { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day .has.none { background: none; }
.day.today .dow::after { content: ' \00b7'; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] .dow { color: inherit; opacity: .8; }
.day[aria-pressed="true"] .has { background: var(--accent-ink); }
.day[aria-pressed="true"] .has.none { background: none; }

.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { border: 0; background: none; padding: 10px 0; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { display: flex; flex-direction: column; gap: 2px; padding-inline: 12px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat .v { font: 500 17px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.goal { display: flex; flex-direction: column; gap: 6px; }
.goal-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.goal-head b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--fillc, var(--accent)); border-radius: 999px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 4.25rem 10px minmax(0, 1fr); column-gap: 10px; min-height: var(--h, 56px); }
.t { font: 500 12px var(--f-mono); color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.rail { display: flex; justify-content: center; }
.bar { width: 6px; border-radius: 3px; background: var(--cat); }
.bar.pt { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
.body { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; min-width: 0; }
.title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); display: inline-block; }
.dur { font: 500 12px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row.gap { min-height: 26px; }
.row.gap .bar { background: none; width: 0; border-left: 2px dashed var(--line); border-radius: 0; }
.row.gap .body { justify-content: center; font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 24px 16px; text-align: center; color: var(--muted); }

.pie { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.pie svg { width: 100%; max-width: 240px; height: auto; align-self: center; }
.opt { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.opt input { width: 18px; height: 18px; accent-color: var(--accent); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.legend li:first-child { border-top: 0; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cat, var(--line)); }
.legend .pct { font: 400 12px var(--f-mono); color: var(--muted); width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }

.tasks { display: flex; flex-direction: column; gap: 8px; }
.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.task .tt { overflow-wrap: anywhere; }
.tag { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.est { font: 500 12px var(--f-mono); font-variant-numeric: tabular-nums; align-self: start; }
.foot { font-size: 12px; color: var(--muted); margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.big { font: 500 22px var(--f-mono); font-variant-numeric: tabular-nums; }
.mini { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Food */
.ringbox { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; align-items: center; }
.ringbox svg { width: 140px; height: 140px; }
.ringlist { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ringlist div { display: flex; flex-direction: column; }
.macro { display: grid; gap: 4px; }
.macro-head { display: flex; justify-content: space-between; font-size: 13px; }
.macro-head span:last-child { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.meal-group { display: flex; flex-direction: column; gap: 4px; }
.meal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.meal .mn { font-weight: 600; overflow-wrap: anywhere; }
.meal .mk { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }

/* Habits */
.hab { display: flex; flex-direction: column; gap: 10px; }
.hab-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.hab-name { font-weight: 600; overflow-wrap: anywhere; }
.grid14 { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.sq { aspect-ratio: 1; border: 0; padding: 0; border-radius: 4px; background: var(--line); min-width: 0; }
.sq.on { background: var(--cat); }
.sq.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.hab-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hab-stats div { display: flex; flex-direction: column; }
.hab-stats b { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
details.arch summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.arch[open] summary { margin-bottom: 10px; }
.arch-body { display: flex; flex-direction: column; gap: 12px; }

/* Money */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
.hbar .track { grid-column: 1 / -1; }
.tx { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
.tx .tn { overflow-wrap: anywhere; }
.pos { color: var(--accent); }

/* Stats */
.selrow { display: grid; grid-template-columns: 1fr; gap: 10px; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 400 10px var(--f-mono); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .barm { fill: var(--accent); }
.chart .barm.sel { fill: var(--ink); }
.chart .hit { fill: transparent; cursor: pointer; }
.readout { min-height: 1.4em; font-size: 13px; color: var(--muted); margin: 0; }
.readout b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; max-width: 260px; }
.hc { aspect-ratio: 1; border-radius: 4px; background: var(--line); min-width: 22px; }
.hc.blank { background: none; }
.hc.v { background: var(--accent); }
.insights { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.insights li { padding-top: 8px; border-top: 1px solid var(--line); }
.insights li:first-child { padding-top: 0; border-top: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl td { padding: 4px 0; border-top: 1px solid var(--line); }
.tbl td:last-child { text-align: right; font-family: var(--f-mono); }
details.tv summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.tvwrap { max-height: 220px; overflow-y: auto; margin-top: 8px; }

.fab { position: fixed; right: max(16px, calc(50% - 224px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 48px; padding-inline: 18px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav ul { list-style: none; margin: 0 auto; padding: 0; max-width: 480px; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 6px 0; border: 0; background: none; border-radius: 10px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { width: 100%; max-width: 480px; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; }
.sheet h2 { font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin: 0; }
.actions { display: flex; gap: 10px; }
.actions button { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: none; font-weight: 600; }
.actions .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s ease; } }
</style>

<main class="app">
  <header class="top">
    <div class="eyebrow">
      <span class="label" id="eyebrow">Timeline</span>
      <span class="example" id="badge">Your Streak + OpenNutriTracker data</span>
    </div>
    <h1 id="heading">Day</h1>
  </header>

  <div class="chips" id="srcwrap" role="group" aria-label="Timeline data">
    <button class="chip-btn" id="src-data" type="button" aria-pressed="true">Your data</button>
    <button class="chip-btn" id="src-ex" type="button" aria-pressed="false">Full-day example</button>
  </div>

  <div class="strip" id="strip" role="group" aria-label="Choose a day"></div>

  <section class="screen" id="screen-timeline">
    <div class="seg" role="group" aria-label="View">
      <button id="v-timeline" aria-pressed="true" type="button">Timeline</button>
      <button id="v-pie" aria-pressed="false" type="button">Pie</button>
    </div>
    <section class="summary" aria-label="Day summary">
      <div class="stat"><span class="label">Study</span><span class="v" id="s-study">0m</span></div>
      <div class="stat"><span class="label">Tracked</span><span class="v" id="s-tracked">0m</span></div>
      <div class="stat"><span class="label">Entries</span><span class="v" id="s-count">0</span></div>
    </section>
    <section class="goal" aria-label="Daily study goal">
      <div class="goal-head"><span>Daily study goal</span><span><b id="g-text">0m</b> of 8h</span></div>
      <div class="track"><div class="fill" id="g-fill" style="width:0%;--fillc:var(--c-study)"></div></div>
    </section>
    <section id="view" aria-live="polite"></section>
    <section class="tasks" id="tasks" aria-label="Open tasks"></section>
  </section>

  <section class="screen" id="screen-food" hidden></section>
  <section class="screen" id="screen-habits" hidden></section>
  <section class="screen" id="screen-money" hidden></section>
  <section class="screen" id="screen-stats" hidden></section>

  <p class="foot" id="foot"></p>
</main>

<button class="fab" id="fab" type="button" aria-haspopup="dialog">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fab-text">Log</span>
</button>

<nav class="nav" aria-label="Sections">
  <ul>
    <li><button type="button" data-tab="timeline"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Timeline</button></li>
    <li><button type="button" data-tab="food"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Food</button></li>
    <li><button type="button" data-tab="habits"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Habits</button></li>
    <li><button type="button" data-tab="money"><svg viewBox="0 0 24 24"><path d="M7 5h10M7 9h10M9 5c5 0 5 7 0 7H7l7 7"/></svg>Money</button></li>
    <li><button type="button" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</button></li>
  </ul>
</nav>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <h2 id="sheet-title">Log</h2>
    <div id="fields" style="display:flex;flex-direction:column;gap:14px"></div>
    <p class="err" id="f-err" role="alert"></p>
    <div class="actions">
      <button type="button" id="f-cancel">Cancel</button>
      <button type="submit" class="primary" id="f-submit">Add</button>
    </div>
  </form>
</div>

<script>

    t.textContent = 'Add money'; sub.textContent = 'Add';
    var typeF = field('x-kind', 'Type', 'select', { options: [['expense', 'Expense'], ['income', 'Income']], value: 'expense' });
    var catF = field('x-cat', 'Category', 'select', { options: EXPENSE_CATS.map(function (c) { return [c, c]; }) });
    put(fieldsBox, typeF, catF,
      two(field('x-amt', 'Amount (₹)', 'number', { min: 0, inputmode: 'decimal' }), field('x-date', 'Date', 'date', { value: TODAY })),
      field('x-note', 'Note (optional)', 'text', { max: 60 }));
    typeF.querySelector('select').addEventListener('change', function (ev) {
      var list = ev.target.value === 'income' ? INCOME_CATS : EXPENSE_CATS, s = document.getElementById('x-cat'); s.textContent = '';
      list.forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; s.appendChild(o); });
    });
  }
  scrim.hidden = false;
  var first = fieldsBox.querySelector('input[type=text]'); if (first) first.focus();
}
function closeSheet() { scrim.hidden = true; document.getElementById('fab').focus(); }
document.getElementById('f-cancel').addEventListener('click', closeSheet);
scrim.addEventListener('click', function (ev) { if (ev.target === scrim) closeSheet(); });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !scrim.hidden) closeSheet(); });
document.getElementById('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var err = document.getElementById('f-err');
  if (state.sheet === 'activity') {
    var s = val('f-start'), e = val('f-end'), title = val('f-title').trim();
    if (!title) { err.textContent = 'Add a short name for what you did.'; return; }
    if (!s || !e) { err.textContent = 'Set both a start and an end time.'; return; }
    if (mins(e) <= mins(s)) { err.textContent = 'The end time must be after the start time.'; return; }
    var item = { s: s, e: e, cat: val('f-cat'), title: title, note: val('f-note').trim() };
    if (state.example) DATA_EX.push(item); else { if (!DATA[state.day]) DATA[state.day] = []; DATA[state.day].push(item); }
  } else if (state.sheet === 'meal') {
    var name = val('m-name').trim(), g = parseFloat(val('m-grams')), k = parseFloat(val('m-kcal'));
    if (!name) { err.textContent = 'Add the name of the food.'; return; }
    if (!(g > 0)) { err.textContent = 'Enter the amount in grams.'; return; }
    if (!(k >= 0)) { err.textContent = 'Enter the kcal per 100 g.'; return; }
    FOODS.push({ day: state.day, time: val('m-time') || '12:00', type: val('m-type'), name: name, brand: '', kcal100: k, c100: parseFloat(val('m-c')) || 0, f100: parseFloat(val('m-f')) || 0, p100: parseFloat(val('m-p')) || 0, grams: g });
  } else if (state.sheet === 'money') {
    var amt = parseFloat(val('x-amt'));
    if (!(amt > 0)) { err.textContent = 'Enter an amount above zero.'; return; }
    MONEY.push({ d: val('x-date') || TODAY, kind: val('x-kind'), cat: val('x-cat'), amt: amt, note: val('x-note').trim() });
  }
  closeSheet(); render();
});
document.getElementById('fab').addEventListener('click', function () {
  openSheet(state.tab === 'food' ? 'meal' : state.tab === 'money' ? 'money' : 'activity');
});

/* ---------- Shell ---------- */
function setTab(tab) {
  state.tab = tab;
  if (tab === 'food' && !foodsOn(state.day).length) state.day = LAST_FOOD_DAY;
  render();
}
document.querySelectorAll('.nav button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); window.scrollTo(0, 0); }); });
document.getElementById('v-timeline').addEventListener('click', function () { state.view = 'timeline'; render(); });
document.getElementById('v-pie').addEventListener('click', function () { state.view = 'pie'; render(); });
document.getElementById('src-data').addEventListener('click', function () { state.example = false; render(); });
document.getElementById('src-ex').addEventListener('click', function () { state.example = true; render(); });

function render() {
  var tab = state.tab;
  document.querySelectorAll('.nav button').forEach(function (b) { if (b.getAttribute('data-tab') === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  ['timeline', 'food', 'habits', 'money', 'stats'].forEach(function (t) { document.getElementById('screen-' + t).hidden = (t !== tab); });
  document.getElementById('eyebrow').textContent = TABS[tab].title;
  var badge = { timeline: state.example ? 'Example day · sample entries' : 'Your Streak + OpenNutriTracker data', food: 'OpenNutriTracker meals + Streak water', habits: 'From your Streak backup', money: 'Sample figures', stats: 'From your Streak backup' }[tab];
  document.getElementById('badge').textContent = badge;
  var heading = { habits: 'Habits', money: 'October 2026', stats: 'Stats' }[tab] || (tab === 'timeline' && state.example ? 'A full day, logged by hand' : fmtDay(state.day, { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''));
  document.getElementById('heading').textContent = heading;
  document.getElementById('srcwrap').hidden = tab !== 'timeline';
  document.getElementById('src-data').setAttribute('aria-pressed', String(!state.example));
  document.getElementById('src-ex').setAttribute('aria-pressed', String(state.example));
  var showStrip = (tab === 'timeline' && !state.example) || tab === 'food';
  document.getElementById('strip').hidden = !showStrip;
  if (showStrip) renderStrip();
  var fab = document.getElementById('fab');
  fab.hidden = !(tab === 'timeline' || tab === 'food' || tab === 'money');
  document.getElementById('fab-text').textContent = tab === 'food' ? 'Add meal' : tab === 'money' ? 'Add' : 'Log';
  var foot = { timeline: state.example ? 'This day is an example of what a fully logged day looks like. Switch to Your data for the real entries.' : 'Built from your Streak backup (4 Oct) and OpenNutriTracker export. Entries you add here are not saved.',
    food: 'Both meals in your export were saved with an amount of 100 servings, so they count here as one 100 g portion each. Calorie and macro goals come from your OpenNutriTracker profile.',
    habits: 'Tap a square to mark or clear a day. Changes are not saved.', money: 'These figures are made up to show the layout. Replace them with your own income and spending.',
    stats: 'Study hours come from the hour counters in Streak. Focus minutes come from your Streak focus timer.' }[tab];
  document.getElementById('foot').textContent = foot;
  if (tab === 'timeline') renderTimelineScreen();
  else if (tab === 'food') renderFood();
  else if (tab === 'habits') renderHabits();
  else if (tab === 'money') renderMoney();
  else renderStats();
}
render();
</script>

</body></html>
